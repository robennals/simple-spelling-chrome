<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 360px; margin: 12px; }
    .top { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 15px; margin: 0; }
    .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
    .toggle input { width: 18px; height: 18px; margin: 0; cursor: pointer; }
    h2 { font-size: 12px; font-weight: 600; color: #555; margin: 12px 0 4px; }
    ol { padding-left: 22px; margin: 0; }
    li { margin: 3px 0; }
    li .ex { display: block; font-size: 11px; color: #777; }
    body.off li { color: #999; }
  </style>
</head>
<body>
  <div class="top">
    <h1>Simple Spelling</h1>
    <label class="toggle"><span id="state">Off</span><input id="on" type="checkbox"></label>
  </div>
  <h2>Spelling rules it applies</h2>
  <ol id="rules"></ol>
  <script src="popup.js"></script>
</body>
</html>
